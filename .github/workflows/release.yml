name: Build Release

on:
  workflow_dispatch:

jobs:
  # Ensure the PACKAGE_NAME repository variable has been created
  config:
    runs-on: ubuntu-latest
    outputs:
      config_package: ${{ steps.config_package.outputs.configPackage }}
    steps:
      - name: Validate Package Config
        id: config_package
        run: |
          if [ "${{ vars.PACKAGE_NAME }}" != "" ]; then
            echo "configPackage=true" >> $GITHUB_OUTPUT;
          else
            echo "configPackage=false" >> $GITHUB_OUTPUT;
          fi

  # Build and release the package. Skipped if PACKAGE_NAME isn't configured.
  #
  # Adapted from https://github.com/vrchat-community/template-package's release.yml:
  # that template assumes the package lives in a "Packages/<name>" subfolder of a
  # full Unity project. This repo's root IS the package (package.json lives at the
  # repo root), since it's added to a Unity project as a local VPM package rather
  # than checked out as a project itself, so packagePath is "." instead.
  build:
    needs: config
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      packagePath: .
    if: needs.config.outputs.config_package == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a

      - name: Get Version
        id: version
        run: echo "value=$(jq -r .version "${{ env.packagePath }}/package.json")" >> "$GITHUB_OUTPUT"

      - name: Set Environment Variables
        run: |
          echo "zipFile=${{ vars.PACKAGE_NAME }}-${{ steps.version.outputs.value }}".zip >> $GITHUB_ENV
          echo "unityPackage=${{ vars.PACKAGE_NAME }}-${{ steps.version.outputs.value }}.unitypackage" >> $GITHUB_ENV
          echo "version=${{ steps.version.outputs.value }}" >> $GITHUB_ENV

      - name: Create Package Zip
        working-directory: "${{ env.packagePath }}"
        # Exclude repo/CI plumbing, tsvrc's own internal test suite, and dev-only docs -
        # none of it is needed to run the package (see Testing/ for the public test API).
        run: |
          zip -r "${{ github.workspace }}/${{ env.zipFile }}" . \
            -x ".git/*" ".github/*" \
            -x "Tests/*" "Tests.meta" \
            -x "AGENTS.md" "CONTRIBUTING.md" "SECURITY.md" "OPEN_SOURCE_PLAN.md"

      - name: Track Package Meta Files
        run: find "${{ env.packagePath }}/" -name \*.meta >> metaList

      - name: Create UnityPackage
        uses: pCYSl5EDgo/create-unitypackage@v1.2.3
        with:
          package-path: ${{ env.unityPackage }}
          include-files: metaList

      - name: Create Tag
        id: tag_version
        uses: rickstaa/action-create-tag@a1c7777fcb2fee4f19b0f283ba888afa11678b72
        with:
          tag: "${{ env.version }}"

      - name: Make Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64
        with:
          files: |
            ${{ env.zipFile }}
            ${{ env.unityPackage }}
            ${{ env.packagePath }}/package.json
          tag_name: ${{ env.version }}

      - name: Notify VPM listing
        run: |
          curl -sf -X POST \
            -H "Authorization: Bearer ${{ secrets.VPM_LISTING_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/tsvrc/vpm/dispatches \
            -d '{"event_type":"package-released"}'
