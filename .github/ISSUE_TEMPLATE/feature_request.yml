name: Feature request
description: Something Core doesn't do yet.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What do you want to do?
      description: What are you trying to build that Core doesn't support today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Ideas
      description: How the API or behavior could look, or what you do today instead.
