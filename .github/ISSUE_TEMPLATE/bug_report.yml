name: Bug report
description: Something in Core doesn't work as documented.
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: >-
        What you did, what you expected, and what happened instead, with any error from the Unity
        log. Steps that start from a new world project help most.
    validations:
      required: true
  - type: input
    id: core-version
    attributes:
      label: Core version
      description: Shown in the Creator Companion, or in package.json of Core.
  - type: input
    id: sdk-version
    attributes:
      label: VRChat Worlds SDK version
